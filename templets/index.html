<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QX Checker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #0f0;
            font-family: monospace;
            padding: 10px;
            min-height: 100vh;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .header {
            text-align: center;
            padding: 20px;
            border-bottom: 2px solid #0f0;
            margin-bottom: 20px;
        }
        .terminal {
            background: #0a0a0a;
            border: 1px solid #0f0;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #000;
            border: 1px solid #0f0;
            color: #0f0;
            font-size: 16px;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #0f0;
            color: #000;
            border: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            margin: 10px 0;
        }
        button:active { background: #0c0; }
        .balance-box {
            background: #000;
            border: 2px solid gold;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
            display: none;
        }
        .balance {
            font-size: 36px;
            color: gold;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #0f0;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: red; text-align: center; }
        .small { font-size: 12px; color: #666; text-align: center; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 QX BALANCE CHECKER</h1>
            <p style="color:#666;margin-top:5px;">v2.0 | Mobile Ready</p>
        </div>

        <div class="terminal">
            <div style="margin-bottom:10px;">> Enter Quotex Credentials:</div>
            
            <input type="email" id="email" placeholder="Email Address" autocomplete="off">
            <input type="password" id="password" placeholder="Password">
            
            <button onclick="checkBalance()">
                ▶ CHECK BALANCE
            </button>
            
            <div class="small">
                Your credentials are secured with encryption
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>Connecting to Quotex...</div>
            <div class="small">This may take 15-20 seconds</div>
        </div>

        <div class="terminal" id="errorBox" style="display:none; border-color: red;">
            <div class="error" id="errorMsg"></div>
        </div>

        <div class="balance-box" id="balanceBox">
            <div style="color:#888;font-size:12px;">CURRENT BALANCE</div>
            <div class="balance" id="balanceAmt">---</div>
            <div style="color:#888;font-size:11px;margin-top:10px;" id="time"></div>
        </div>

        <div class="terminal" id="compoundBox" style="display:none;">
            <div style="margin-bottom:10px;">📈 Compounding Projection (5% Daily)</div>
            <div id="compoundData"></div>
        </div>
    </div>

    <script>
        async function checkBalance() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if(!email || !password) {
                alert('Email and password required!');
                return;
            }
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('balanceBox').style.display = 'none';
            document.getElementById('errorBox').style.display = 'none';
            
            try {
                const res = await fetch('/api/check_balance', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password})
                });
                
                const data = await res.json();
                
                if(data.success) {
                    document.getElementById('balanceAmt').textContent = data.balance;
                    document.getElementById('time').textContent = 
                        'Checked: ' + new Date().toLocaleString('en-IN');
                    document.getElementById('balanceBox').style.display = 'block';
                    
                    // Extract number and calculate compounding
                    let num = parseFloat(data.balance.replace(/[^0-9.]/g, ''));
                    if(num > 0) showCompounding(num);
                    
                } else {
                    document.getElementById('errorMsg').textContent = data.error;
                    document.getElementById('errorBox').style.display = 'block';
                }
            } catch(e) {
                document.getElementById('errorMsg').textContent = 'Connection failed. Try again.';
                document.getElementById('errorBox').style.display = 'block';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        function showCompounding(balance) {
            const box = document.getElementById('compoundBox');
            const data = document.getElementById('compoundData');
            
            let html = '<div style="font-size:12px;">';
            for(let day of [1, 7, 14, 21, 30]) {
                let futureBalance = balance * Math.pow(1.05, day);
                let profit = futureBalance - balance;
                html += `Day ${day}: $${futureBalance.toFixed(2)} (+${profit.toFixed(2)})<br>`;
            }
            html += '</div>';
            
            data.innerHTML = html;
            box.style.display = 'block';
        }
        
        // Enter key support
        document.getElementById('password').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') checkBalance();
        });
    </script>
</body>
</html>
